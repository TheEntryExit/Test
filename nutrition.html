<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>Calorie Track</title><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#101828;--muted:#667085;--line:#e5e7eb;--navy:#0b1220;--accent:#2563eb;--green:#16a34a;--red:#dc2626;--orange:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:980px;margin:auto;min-height:100vh}.top{background:var(--navy);color:white;padding:18px 18px 22px;position:sticky;top:0;z-index:3}.toprow{display:flex;justify-content:space-between;align-items:center}.title{font-size:22px;font-weight:800}.date{font-size:13px;color:#b8c1d1;margin-top:4px}.menu{font-size:24px;background:none;border:0;color:white}.content{padding:16px}.hero{background:linear-gradient(135deg,#111827,#1e3a8a);color:#fff;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 10px 30px #0b12201c}.hero small{color:#cbd5e1}.hero h1{font-size:40px;margin:5px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#ffffff18;border:1px solid #ffffff1f;border-radius:14px;padding:12px}.stat b{display:block;font-size:18px;margin-top:4px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 18px #1018280a}.card h2{font-size:16px;margin:0 0 14px}.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #eef0f3}.row:last-child{border-bottom:0}.muted{color:var(--muted)}.good{color:var(--green)}.bad{color:var(--red)}button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer}.secondary{background:#eef2ff;color:#1d4ed8}.danger{background:#fee2e2;color:#b91c1c}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form .full{grid-column:1/-1}label{font-size:12px;color:var(--muted);font-weight:600}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:5px;font:inherit} .bar{height:12px;background:#e9edf4;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);border-radius:99px}.section{margin-top:18px}.side{position:fixed;inset:0 0 0 auto;width:min(330px,88vw);background:#fff;z-index:10;transform:translateX(105%);transition:.25s;padding:20px;box-shadow:-10px 0 30px #0002}.side.open{transform:translateX(0)}.side button{display:block;width:100%;text-align:left;margin:8px 0;background:#f3f4f6;color:#111827}.close{background:#111827!important;color:#fff!important}.hidden{display:none}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calhead,.day{padding:8px 3px;text-align:center;font-size:12px}.day{background:#fff;border:1px solid var(--line);border-radius:9px;min-height:54px;cursor:pointer}.def{color:var(--green);font-weight:800}.sur{color:var(--red);font-weight:800}.chart{height:220px;width:100%;display:block}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:700}.empty{text-align:center;color:var(--muted);padding:20px}.footer{height:30px}@media(max-width:650px){.cards{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:34px}.form{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><aside class="side" id="side"><button class="close" onclick="closeMenu()">✕ Close</button><button onclick="show('daily')">🏠 Daily</button><button onclick="show('progress')">📊 Progress Card</button><button onclick="show('calendar')">📅 Calorie Calendar</button><button onclick="show('charts')">📈 Progress Charts</button><button onclick="show('prediction')">🔮 Prediction</button><button onclick="show('settings')">⚙️ Settings</button></aside><script>
const KEY='calorieTrackV1';
let db=JSON.parse(localStorage.getItem(KEY)||'{"settings":{"startWeight":70.5,"goalWeight":60.5,"deficitTarget":77000,"calPerKg":7700},"days":{}}');
const iso=()=>new Date().toISOString().slice(0,10);function save(){localStorage.setItem(KEY,JSON.stringify(db))}function day(d=iso()){if(!db.days[d])db.days[d]={maintenance:2200,foods:[],burns:[]};return db.days[d]}function esc(s){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#39;'}[m]))}function totals(d){let x=day(d),food=x.foods.reduce((a,f)=>({cal:a.cal+f.cal,p:a.p+f.p,c:a.c+f.c,f:a.f+f.f}),{cal:0,p:0,c:0,f:0}),burn=x.burns.reduce((a,b)=>a+b.cal,0),total=x.maintenance+burn;return {...food,burn,total,result:total-food.cal}}function fmt(n){return Math.round(n).toLocaleString('en-IN')}function openMenu(){document.getElementById('side').classList.add('open')}function closeMenu(){document.getElementById('side').classList.remove('open')}
function shell(title,sub=''){return `<header class="top"><div class="toprow"><div><div class="title">${title}</div><div class="date">${sub}</div></div><button class="menu" onclick="openMenu()">☰</button></div></header><main class="content" id="content"></main>`}
function show(page='daily',date=iso()){closeMenu();document.getElementById('app').innerHTML=shell(page==='daily'?'Daily':page==='progress'?'Progress Card':page==='calendar'?'Calorie Calendar':page==='charts'?'Progress Charts':page==='prediction'?'Prediction':'Settings',new Date(date+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}));let c=document.getElementById('content'); if(page==='daily')renderDaily(c,date);if(page==='progress')renderProgress(c);if(page==='calendar')renderCalendar(c);if(page==='charts')renderCharts(c);if(page==='prediction')renderPrediction(c);if(page==='settings')renderSettings(c)}
function renderDaily(c,d){let x=day(d),t=totals(d);c.innerHTML=`<section class="hero"><small>Today's deficit / surplus</small><h1 class="${t.result>=0?'':'bad'}">${t.result>=0?'+':''}${fmt(t.result)} kcal</h1><div class="grid"><div class="stat"><small>Food</small><b>${fmt(t.cal)}</b></div><div class="stat"><small>Total burn</small><b>${fmt(t.total)}</b></div><div class="stat"><small>Maintenance</small><b>${fmt(x.maintenance)}</b></div></div></section><div class="cards"><section class="card"><h2>🍎 Add Food</h2><div class="form"><div><label>Food name</label><input id="fn" placeholder="Chicken breast"></div><div><label>Quantity</label><input id="fq" placeholder="150 g"></div><div><label>Calories</label><input id="fc" type="number" placeholder="248"></div><div><label>Protein (g)</label><input id="fp" type="number" placeholder="46"></div><div><label>Carbs (g)</label><input id="fcarb" type="number" placeholder="0"></div><div><label>Fat (g)</label><input id="ff" type="number" placeholder="5"></div><div class="full"><button onclick="addFood('${d}')">Add Food</button></div></div></section><section class="card"><h2>🔥 Add Calories Burned</h2><div class="form"><div><label>Activity</label><input id="bn" placeholder="Walking / Gym"></div><div><label>Calories burned</label><input id="bc" type="number" placeholder="250"></div><div class="full"><button onclick="addBurn('${d}')">Add Burn</button></div></div></section></div><section class="card"><h2>Today's Food Log</h2>${x.foods.length?x.foods.map((f,i)=>`<div class="row"><span><b>${esc(f.name)}</b><br><span class="muted">${esc(f.qty)} · ${fmt(f.p)}g P · ${fmt(f.c)}g C · ${fmt(f.f)}g F</span></span><span><b>${fmt(f.cal)} kcal</b><br><button class="danger" onclick="delFood('${d}',${i})">Delete</button></span></div>`).join(''):'<div class="empty">No food logged yet.</div>'}</section><section class="card"><h2>Today's Burn Log</h2>${x.burns.length?x.burns.map((b,i)=>`<div class="row"><span>${esc(b.name)}</span><span><b>${fmt(b.cal)} kcal</b> <button class="danger" onclick="delBurn('${d}',${i})">Delete</button></span></div>`).join(''):'<div class="empty">No extra calories burned logged.</div>'}</section>`}
function addFood(d){let x=day(d);let f={name:document.getElementById('fn').value.trim(),qty:document.getElementById('fq').value.trim(),cal:+document.getElementById('fc').value||0,p:+document.getElementById('fp').value||0,c:+document.getElementById('fcarb').value||0,f:+document.getElementById('ff').value||0};if(!f.name)return alert('Enter a food name');x.foods.push(f);save();show('daily',d)}function addBurn(d){let x=day(d),name=document.getElementById('bn').value.trim(),cal=+document.getElementById('bc').value||0;if(!name||!cal)return alert('Enter activity and calories');x.burns.push({name,cal});save();show('daily',d)}function delFood(d,i){day(d).foods.splice(i,1);save();show('daily',d)}function delBurn(d,i){day(d).burns.splice(i,1);save();show('daily',d)}
function stats(){let entries=Object.entries(db.days).sort();let cumulative=0,days=0;let rows=[];for(let [d] of entries){let t=totals(d);if(t.cal||t.burn||t.result!==0){cumulative+=t.result;days++;rows.push({d,t,cumulative})}}return {rows,cumulative,days,avg:days?cumulative/days:0}}
function renderProgress(c){let s=stats(),set=db.settings,p=Math.max(0,Math.min(100,s.cumulative/set.deficitTarget*100)),loss=s.cumulative/set.calPerKg,w=set.startWeight-loss;let color=p>=90?'#16a34a':p>=60?'#7c3aed':p>=30?'#2563eb':'#f59e0b';c.innerHTML=`<section class="hero"><small>Overall calorie deficit</small><h1>${fmt(s.cumulative)} kcal</h1><div class="bar"><div class="fill" style="width:${p}%;background:${color}"></div></div><p>${p.toFixed(1)}% of ${fmt(set.deficitTarget)} kcal target</p></section><div class="cards"><section class="card"><h2>🔥 Deficit Goal</h2><div class="row"><span>Completed</span><b>${fmt(s.cumulative)} kcal</b></div><div class="row"><span>Remaining</span><b>${fmt(Math.max(0,set.deficitTarget-s.cumulative))} kcal</b></div><div class="row"><span>Average / day</span><b>${fmt(s.avg)} kcal</b></div></section><section class="card"><h2>⚖️ Theoretical Weight</h2><div class="row"><span>Starting</span><b>${set.startWeight.toFixed(1)} kg</b></div><div class="row"><span>Theoretical now</span><b>${w.toFixed(1)} kg</b></div><div class="row"><span>Goal</span><b>${set.goalWeight.toFixed(1)} kg</b></div><div class="bar"><div class="fill" style="width:${p}%;background:${color}"></div></div><p class="muted">${loss.toFixed(2)} kg theoretical loss</p></section></div><section class="card"><h2>Keep going</h2><p>${p<25?'You're building the streak. Every deficit counts.':p<60?'Solid progress. Keep stacking consistent days.':p<90?'You are well into the goal. Keep the routine steady.':'The finish line is close. Stay consistent!'}</p></section>`}
function renderCalendar(c){let now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let h='<section class="card"><h2>'+now.toLocaleString(undefined,{month:'long',year:'numeric'})+'</h2><div class="calendar">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="calhead muted">${x}</div>`).join('');for(let i=0;i<first;i++)h+='<div></div>';for(let n=1;n<=days;n++){let d=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,t=db.days[d]?totals(d):null;h+=`<div class="day" onclick="show('daily','${d}')"><b>${n}</b>${t&&t.result!==0?`<div class="${t.result>0?'def':'sur'}">${t.result>0?'+':''}${fmt(t.result)}</div>`:'<div class="muted">—</div>'}</div>`}h+='</div></section><section class="card"><span class="def">● Green = deficit</span> &nbsp; <span class="sur">● Red = surplus</span><p class="muted">Tap any day to open that day's food and calorie log.</p></section>';c.innerHTML=h}
function renderPrediction(c){let s=stats(),set=db.settings,remain=Math.max(0,set.deficitTarget-s.cumulative),days=s.avg>0?remain/s.avg:Infinity,date=new Date();if(isFinite(days))date.setDate(date.getDate()+Math.ceil(days));c.innerHTML=`<section class="hero"><small>Based on your current average deficit</small><h1>${isFinite(days)?Math.ceil(days)+' days':'Not enough data'}</h1><p>${isFinite(days)?'Estimated goal date: '+date.toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'}):'Log at least one deficit day to create a prediction.'}</p></section><section class="card"><h2>Prediction inputs</h2><div class="row"><span>Average daily deficit</span><b>${fmt(s.avg)} kcal/day</b></div><div class="row"><span>Current cumulative deficit</span><b>${fmt(s.cumulative)} kcal</b></div><div class="row"><span>Remaining deficit</span><b>${fmt(remain)} kcal</b></div><div class="row"><span>Conversion</span><b>${fmt(set.calPerKg)} kcal = 1 kg</b></div></section>`}
function renderCharts(c){let s=stats();c.innerHTML=`<section class="card"><h2>Cumulative Deficit</h2><canvas class="chart" id="defChart"></canvas></section><section class="card"><h2>Theoretical Weight</h2><canvas class="chart" id="wtChart"></canvas></section>`;draw('defChart',s.rows.map(r=>r.cumulative),0,db.settings.deficitTarget,'kcal',true);draw('wtChart',s.rows.map(r=>db.settings.startWeight-r.cumulative/db.settings.calPerKg),db.settings.goalWeight,db.settings.startWeight,'kg',false)}function draw(id,data,min,max,unit,up){let cv=document.getElementById(id),ctx=cv.getContext('2d'),w=cv.width=cv.clientWidth*devicePixelRatio,h=cv.height=cv.clientHeight*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);w=cv.clientWidth;h=cv.clientHeight;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#dbe2ea';ctx.lineWidth=1;for(let i=0;i<5;i++){let y=20+i*(h-45)/4;ctx.beginPath();ctx.moveTo(35,y);ctx.lineTo(w-10,y);ctx.stroke()}if(!data.length){ctx.fillStyle='#667085';ctx.fillText('No data yet',45,100);return}let lo=Math.min(min,...data),hi=Math.max(max,...data);if(hi===lo)hi=lo+1;ctx.strokeStyle='#2563eb';ctx.lineWidth=3;ctx.beginPath();data.forEach((v,i)=>{let x=35+(w-50)*(i/Math.max(1,data.length-1)),y=15+(h-45)*(1-(v-lo)/(hi-lo));i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle='#667085';ctx.font='12px sans-serif';ctx.fillText(max.toFixed(unit==='kg'?1:0)+' '+unit,5,16);ctx.fillText(min.toFixed(unit==='kg'?1:0)+' '+unit,5,h-25)}
function renderSettings(c){let s=db.settings,d=day();c.innerHTML=`<section class="card"><h2>Goal Settings</h2><div class="form"><div><label>Starting weight (kg)</label><input id="sw" type="number" step="0.1" value="${s.startWeight}"></div><div><label>Goal weight (kg)</label><input id="gw" type="number" step="0.1" value="${s.goalWeight}"></div><div><label>Total deficit target (kcal)</label><input id="dt" type="number" value="${s.deficitTarget}"></div><div><label>Calories per kg loss</label><input id="ck" type="number" value="${s.calPerKg}"></div><div class="full"><button onclick="saveSettings()">Save Goal Settings</button></div></div></section><section class="card"><h2>Today's Maintenance</h2><p class="muted">Changing this only affects today. Previous days keep their own saved maintenance value.</p><input id="mc" type="number" value="${d.maintenance}"><button style="margin-top:10px" onclick="saveMaintenance()">Save Today's Maintenance</button></section><section class="card"><h2>Backup</h2><button class="secondary" onclick="exportData()">Export Backup</button> <button class="secondary" onclick="document.getElementById('imp').click()">Import Backup</button><input id="imp" type="file" accept="application/json" class="hidden" onchange="importData(event)"><button class="danger" style="margin-top:10px" onclick="resetData()">Reset All Data</button></section>`}function saveSettings(){db.settings.startWeight=+sw.value;db.settings.goalWeight=+gw.value;db.settings.deficitTarget=+dt.value;db.settings.calPerKg=+ck.value;save();show('settings')}function saveMaintenance(){day().maintenance=+mc.value||0;save();show('settings')}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='calorie-track-backup.json';a.click()}function importData(e){let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();show('settings')}catch{alert('Invalid backup')}};r.readAsText(e.target.files[0])}function resetData(){if(confirm('Delete all nutrition data?')){localStorage.removeItem(KEY);location.reload()}}
show();
</script></body></html>
